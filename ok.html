const DEMO_TERMO = { categoria: 'prestador', apto: '92', cliente: 'Nome do Cliente', modulo: 'Automação', titulo: 'Termo de Automação', prazo: '5 dias úteis, de 01/12/2026 a 05/12/2026', itens: [], intro: '', obs_geral: '', status: 'aberto', nome_cliente: '', nome_arquiteto: '', assinado_em: '', hash: '', assinatura_cliente: '', assinatura_arquiteto: '', empresa: '', documento: '', cnpj: '', telefone: '', doc_foto: '', doc_cnpj_foto: '', doc_nr_foto: '', texto: "TERMO DE RESPONSABILIDADE E CONDIÇÕES DE EXECUÇÃO\nSERVIÇOS DE AUTOMAÇÃO\n\nEste termo é firmado entre ABSOLUTA CONSTRUTORA E INCORPORADORA e o PRESTADOR identificado neste termo, para estabelecer as condições de acesso e execução dos serviços de automação no apartamento indicado, localizado no empreendimento Essence Residence.\n\n1. OBJETO E CONDIÇÕES DA CONTRATAÇÃO\n\n1.1. O Prestador executará os serviços de automação e infraestrutura correspondente no apartamento indicado, conforme o escopo e os valores acordados diretamente com o cliente, respeitando o projeto aprovado e as orientações da arquiteta responsável.\n\n1.2. A contratação, negociação de valores, pagamentos e demais condições comerciais são de responsabilidade exclusiva do cliente e do Prestador, não cabendo à Absoluta responsabilidade pelas obrigações comerciais assumidas entre as partes, sem prejuízo das responsabilidades legais próprias da construtora.\n\n2. ACESSO E CONDUTA NA OBRA\n\n2.1. O Prestador e sua equipe poderão acessar somente o apartamento indicado e os caminhos necessários até ele, nos dias e horários previamente autorizados pela Absoluta e pelo condomínio/obra.\n\n2.2. REGISTRO OBRIGATÓRIO: todos os integrantes da equipe deverão estar previamente identificados, cadastrados e informados à Absoluta, antes do primeiro acesso. SEM REGISTRO, NÃO HÁ ENTRADA NA OBRA, em nenhuma hipótese. A Absoluta poderá impedir o acesso, a qualquer momento, de qualquer pessoa sem o devido registro.\n\n2.3. O Prestador deverá respeitar as regras de async function post(action, dados) {

    if (action === 'uploadFotoTermoVistoria') return { fileId: 'demo', fotos: ['demo'] };
    if (action === 'assinarTermoVistoria') Object.assign(DEMO_TERMO, { status: 'aguardando_absoluta', nome_cliente: dados.nome_cliente, documento: dados.documento, cnpj: dados.cnpj, empresa: dados.empresa, telefone: dados.telefone, assinatura_cliente: dados.assinatura_cliente });
    return { ok: true };
  }
  const r = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action, dados, usuario: 'Termo público' }) });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j.data;
}

// Reduz a foto antes de enviar (celular tira foto de vários MB)
function reduzirImagem(file, max) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const esc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * esc); c.height = Math.round(img.naturalHeight * esc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.8).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Não consegui ler a foto')); };
    img.src = url;
  });
}
async function enviarFoto(id, input) {
  const file = input.files && input.files[0]; if (!file) return;
  mostrarSalvo('Enviando foto…');
  try {
    const b64 = await reduzirImagem(file, 1400);
    const r = await post('uploadFotoTermoVistoria', { token: TOKEN, item_id: id, mimeType: 'image/jpeg', base64data: b64 });
    termo.itens.find(x => x.id === id).fotos = r.fotos;
    const box = document.getElementById('fotos-' + id), label = box.querySelector('label');
    const a = document.createElement('a'); a.href = fotoLink(r.fileId); a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML = `<img src="${fotoUrl(r.fileId, 300)}" alt="Foto">`; box.insertBefore(a, label);
    mostrarSalvo('Foto enviada ✓', true); if (window.atualizarNav) atualizarNav();
  } catch (e) { mostrarSalvo('Erro na foto: ' + e.message); }
  input.value = '';
}

function iniciarPad(qual) {
  const cv = document.getElementById('pad-' + qual), dpr = window.devicePixelRatio || 1;
  const rect = cv.getBoundingClientRect(); cv.width = Math.round(rect.width * dpr); cv.height = Math.round(rect.height * dpr);
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
  const pad = pads[qual] = { cv, ctx, desenhou: false, desenhando: false };
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); pad.desenhando = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + .1, p.y + .1); ctx.stroke(); pad.desenhou = true; document.getElementById('hint-' + qual).style.display = 'none'; });
  cv.addEventListener('pointermove', e => { if (!pad.desenhando) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
  const fim = () => { pad.desenhando = false; };
  cv.addEventListener('pointerup', fim); cv.addEventListener('pointercancel', fim);
}
function limpar(qual) {
  const p = pads[qual]; p.ctx.save(); p.ctx.setTransform(1, 0, 0, 1, 0, 0); p.ctx.clearRect(0, 0, p.cv.width, p.cv.height); p.ctx.restore();
  p.desenhou = false; document.getElementById('hint-' + qual).style.display = '';
}
// Exporta pequena (cabe na célula da planilha): 420x140 px
function exportarAssinatura(qual) {
  const p = pads[qual], c = document.createElement('canvas'); c.width = 420; c.height = 140;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 420, 140); x.drawImage(p.cv, 0, 0, 420, 140);
  return c.toDataURL('image/png');
}

async function assinar() {
  const erro = document.getElementById('erro'); erro.style.display = 'none';
  const falha = m => { erro.textContent = m; erro.style.display = 'block'; erro.scrollIntoView({ block: 'center', behavior: 'smooth' }); };
  termo.obs_geral = document.getElementById('obs-geral').value;
  const r = resumoStatus();
  if (r.falta) return falha('Falta marcar ' + r.falta + ' item(ns) como OK ou Ressalva.');
  const semObs = termo.itens.find(i => i.status === 'ressalva' && !String(i.obs || '').trim() && !(i.fotos || []).length);
  if (semObs) { irParaItem(semObs.id); return falha('No item "' + semObs.texto + '", escreva o que aconteceu ou tire uma foto.'); }
  const nc = document.getElementById('nome-cliente').value.trim(), na = document.getElementById('nome-arquiteto').value.trim();
  if (!nc) return falha('Escreva o nome completo do cliente.');
  if (!pads.cliente.desenhou) return falha('Falta a assinatura do cliente.');
  const arqAssinou = !!(pads.arquiteto && pads.arquiteto.desenhou);
  if (na && !arqAssinou) return falha('Falta a assinatura do arquiteto (ou apague o nome dele).');
  if (!na && arqAssinou) return falha('Escreva o nome do arquiteto.');
  if (!confirm('Enviar o termo? Depois de enviado ele não poderá mais ser alterado.')) return;
  const btn = document.getElementById('btn-assinar'); btn.disabled = true; btn.textContent = 'Enviando…';
  try {
    clearTimeout(_t);
    await post('assinarTermoVistoria', { token: TOKEN, itens: termo.itens.map(i => ({ id: i.id, status: i.status, obs: i.obs })), obs_geral: document.getElementById('obs-geral').value,
      nome_cliente: nc, assinatura_cliente: exportarAssinatura('cliente'), nome_arquiteto: na, assinatura_arquiteto: na ? exportarAssinatura('arquiteto') : '' });
    window._enviado = true; await carregar(); window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) { btn.disabled = false; btn.textContent = 'Enviar'; falha(e.message); }
}

    [['Nome', termo.nome_cliente], ['CPF', termo.documento], ...(termo.cnpj ? [['CNPJ', termo.cnpj]] : []), ['Empresa', termo.empresa], ['Telefone', termo.telefone]].forEach(l => { doc.text(l[0] + ': ' + (l[1] || ''), 12, y); y += 5.6; });
    y += 4;
    for (const [chave, rot] of [['doc_foto', 'Documento pessoal'], ['doc_cnpj_foto', 'Cartão CNPJ'], ['doc_nr_foto', 'Certificado NR-10']]) {
      if (!termo[chave]) continue;
      const d = await imgParaDataUrl(fotoUrl(termo[chave], 900));
      if (d) { nova(76); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(120, 114, 96); doc.text(rot, 12, y); try { doc.addImage(d, 'JPEG', 12, y + 2, 80, 60); y += 70; } catch (e) {} }
    }
    nova(50);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...dourado); doc.text('ASSINATURAS', 12, y); y += 4; doc.setDrawColor(...dourado);
    const sig = (img, nome, papel, x) => { try { doc.addImage(img, 'PNG', x, y, 60, 20); } catch (e) {} doc.line(x, y + 22, x + 80, y + 22);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(28, 26, 21); doc.text(nome, x, y + 27); doc.setFont('helvetica', 'normal'); doc.setTextColor(120, 114, 96); doc.text(papel, x, y + 31.5); };
    sig(termo.assinatura_cliente, termo.nome_cliente, 'Prestador', 12); if (termo.assinatura_arquiteto) sig(termo.assinatura_arquiteto, termo.nome_arquiteto, 'Absoluta', 112);
    y += 40; doc.setFontSize(7.5); doc.setTextColor(140, 132, 103);
    doc.text('Termo assinado pelas duas partes em ' + termo.assinado_em + '  ·  Código de verificação: ' + termo.hash, 12, y);
    doc.save('Termo-Prestador-Apto' + termo.apto + '-' + (termo.nome_cliente || 'prestador').replace(/[^\w]+/g, '-').slice(0, 30) + '.pdf');
  } catch (e) { alert('Não consegui gerar o PDF: ' + e.message); }
  if (btn) { btn.disabled = false; btn.textContent = 'Baixar PDF do termo'; }
}

// ================= PASSO A PASSO (capa + uma pergunta por página) =================
let passos = [], passo = 0;
function montarPassos() {
  passos = [{ t: 'capa' }];
  if (termo.intro) passos.push({ t: 'texto' });
  termo.itens.forEach((it, i) => passos.push({ t: 'item', i }));
  passos.push({ t: 'final' });
}
function renderWizard() {
  document.body.classList.add('wiz');
  montarPassos();
  const algum = termo.itens.some(i => i.status);
  passo = 0;
  if (algum) { const k = passos.findIndex(q => q.t === 'item' && !respondido(termo.itens[q.i])); passo = k >= 0 ? k : passos.length - 1; }
  desenhar();
}
function irParaItem(id) { const k = passos.findIndex(q => q.t === 'item' && termo.itens[q.i].id === id); if (k >= 0) { passo = k; desenhar(); } }
function respondido(it) { return it.status === 'ok' || (it.status === 'ressalva' && (String(it.obs || '').trim() || (it.fotos || []).length > 0)); }
function fotosHtml(it) { return (it.fotos || []).map(id => `<a href="${fotoLink(id)}" target="_blank" rel="noopener"><img src="${fotoUrl(id, 300)}" alt="Foto"></a>`).join(''); }
// parte de baixo da pergunta: aparece quando a resposta é "Não" (ou se a pessoa quiser acrescentar algo ao "Sim")
function semExtras() { return termo.categoria !== 'prestador' && termo.modulo === 'Revestimentos'; }
function extraHtml(it) {
  if (semExtras() && it.status !== 'ressalva') return '';
  const aberto = it.status === 'ressalva' || window._extraAberto === it.id || String(it.obs || '').trim() || (it.fotos || []).length;
  if (it.status === 'ok' && !aberto) return `<button class="extra-add" onclick="window._extraAberto='${it.id}';document.getElementById('extra-${it.id}').innerHTML=extraHtml(termo.itens.find(x=>x.id==='${it.id}'))">＋ Adicionar foto ou comentário</button>`;
  if (!it.status) return '';
  return `${it.status === 'ressalva' ? '<div class="dica-nao">Conte o que está diferente do esperado: tire uma <strong>foto</strong> e/ou escreva uma <strong>observação</strong>. Assim a gente resolve.</div>' : ''}
    <textarea id="obs-${it.id}" placeholder="${it.status === 'ressalva' ? 'O que aconteceu? (observação)' : 'Comentário (opcional)'}" oninput="mudouObs('${it.id}',this.value)">${esc(it.obs)}</textarea>
    <div class="fotos" id="fotos-${it.id}">${fotosHtml(it)}<label class="btn">📷 ${(it.fotos || []).length ? 'Adicionar outra foto' : 'Tirar / adicionar foto'}<input type="file" accept="image/*" style="display:none" onchange="enviarFoto('${it.id}',this)"></label></div>`;
}
function desenhar() {
  document.body.classList.add('prest'); document.documentElement.setAttribute('data-theme', 'light');
  const app = document.getElementById('app'), q = passos[passo], total = passos.length - 1;
  window.scrollTo(0, 0);
  if (q.t === 'capa') {
    document.body.classList.add('prest'); document.documentElement.setAttribute('data-theme', 'light');
    app.innerHTML = `${_capaCliente()}<div class="pagina" style="padding-bottom:140px"><div class="q-num">${esc(termo.modulo || 'Termo')}</div>
      <h2 class="q-txt" style="margin-bottom:10px">${esc(termo.titulo || 'Termo')}</h2>
      <p class="q-sub" style="margin:0">Apartamento ${esc(termo.apto)}${termo.cliente ? ' · ' + esc(termo.cliente) : ''}</p>
      <p class="intro" style="margin-top:22px">Você vai responder algumas perguntas rápidas sobre o seu apartamento e, no final, assinar na tela. Leva poucos minutos.</p></div>
      <div class="rodape-wiz"><div class="in"><button class="btn primary" onclick="avancar()">Iniciar</button></div></div>`;
    return;
  }
  if (false) {
    app.innerHTML = `<section class="capa2"><div class="fundo"></div><div class="pilula">
      <div class="foto"></div>
      <img class="essence-logo" src="assets/logo-essence.png" alt="Essence Residence">
      <div class="nome">${esc(termo.titulo || 'Termo')}</div>
      <div class="det">Apartamento ${esc(termo.apto)}${termo.cliente ? '<br>' + esc(termo.cliente) : ''}</div>
      <button class="iniciar" onclick="avancar()">Iniciar</button>
      <img class="logo-abs" src="assets/logo-absoluta.png" alt="Absoluta">
    </div></section>`;
    return;
  }
  let corpo = '', nav = '';
  if (q.t === 'texto') {
    corpo = `<div class="q-num">${esc(termo.titulo || 'Termo')}</div><p class="leia">Leia com atenção</p><div class="card"><div class="capa-txt">${esc(termo.intro)}</div></div>`;
    nav = `<button class="btn" onclick="voltar()">Voltar</button><button class="btn primary" onclick="avancar()">Próximo</button>`;
  } else if (q.t === 'item') {
    const it = termo.itens[q.i];
    corpo = `<div class="q-num">Pergunta ${q.i + 1} de ${termo.itens.length}</div><h2 class="q-txt">${esc(it.texto)}</h2>
      <div id="item-${it.id}">
        <div class="seg">
          <button class="${it.status === 'ok' ? 'on-ok' : ''}" onclick="marcar('${it.id}','ok')">Sim</button>
          <button class="${it.status === 'ressalva' ? 'on-res' : ''}" onclick="marcar('${it.id}','ressalva')">Não</button>
        </div>
        <div id="extra-${it.id}">${extraHtml(it)}</div>
      </div><div class="erro-passo" id="erro-passo"></div>`;
    nav = `<button class="btn" onclick="voltar()">Voltar</button><button class="btn primary" id="btn-prox" onclick="avancar()">${passo === passos.length - 2 ? 'Finalizar' : 'Próximo'}</button>`;
  } else {
    corpo = `<div class="q-num">Última etapa</div><h2 class="q-txt">Revisão e assinatura</h2>
      ${termo.itens.length ? `<div class="card" style="padding:4px 16px">${termo.itens.map((it, i) => `<div class="resumo-lin" onclick="irParaItem('${it.id}')"><span><span style="color:var(--text3)">${i + 1}.</span> ${esc(it.texto)}</span><span class="badge ${it.status === 'ok' ? 'ok' : 'res'}">${it.status === 'ok' ? 'Sim' : it.status === 'ressalva' ? 'Não' : '—'}</span></div>`).join('')}</div>` : ''}
      ${semExtras() ? '<textarea id="obs-geral" style="display:none"></textarea>' : `<h2>Observações gerais</h2><div class="card" style="margin-top:8px"><textarea id="obs-geral" placeholder="Algo mais que queira registrar (opcional)" style="margin-top:0">${esc(termo.obs_geral)}</textarea></div>`}
      ${termo.texto ? `<h2>Declaração</h2><div class="card" style="margin-top:8px"><div class="capa-txt">${esc(termo.texto)}</div></div>` : ''}
      <h2>Assinatura</h2>
      <div class="card" style="margin-top:8px">
        <div class="sig"><strong>Cliente</strong><input type="text" id="nome-cliente" placeholder="Nome completo do cliente" value="${esc(termo.nome_cliente)}">
          <canvas id="pad-cliente"></canvas><div class="hint" id="hint-cliente">Assine aqui com o dedo</div><button class="btn limpar" onclick="limpar('cliente')">Limpar</button></div>
        <details style="margin-top:20px"><summary style="cursor:pointer;font-size:13px;font-weight:600;color:var(--text2)">Arquiteto presente? Assinar também (opcional)</summary>
          <div class="sig" style="margin-top:8px"><strong>Arquiteto</strong><input type="text" id="nome-arquiteto" placeholder="Nome completo do arquiteto" value="${esc(termo.nome_arquiteto)}">
          <canvas id="pad-arquiteto"></canvas><div class="hint" id="hint-arquiteto">Assine aqui com o dedo</div><button class="btn limpar" onclick="limpar('arquiteto')">Limpar</button></div>
        </details>
        <p class="intro" style="margin:18px 0 0">Ao enviar, declaro que conferi o que está descrito neste termo e que as respostas e observações registradas correspondem ao que foi verificado no apartamento. Depois de enviado, o termo não pode mais ser alterado.</p>
        <div class="erro" id="erro" style="display:none"></div>
        <button class="btn primary big" style="margin-top:14px" id="btn-assinar" onclick="assinar()">Enviar</button>
      </div>`;
    nav = `<button class="btn" style="flex:1" onclick="voltar()">Voltar</button>`;
  }
  app.innerHTML = `<div class="topo-wiz"><div class="lin"><span>${esc(termo.modulo || 'Termo')}</span><span>Apto ${esc(termo.apto)}</span></div><div class="barra"><i style="width:${Math.round(passo / total * 100)}%"></i></div></div>
    <div class="pagina">${corpo}</div><div class="rodape-wiz"><div class="in">${nav}</div></div>`;
  if (q.t === 'final') {
    iniciarPad('cliente'); document.getElementById('obs-geral').addEventListener('input', e => { termo.obs_geral = e.target.value; agendarSalvar(); });
    const det = document.querySelector('details'); det.addEventListener('toggle', () => { if (det.open && !pads.arquiteto) iniciarPad('arquiteto'); });
    if (termo.nome_arquiteto) { det.open = true; }
  }
  atualizarNav();
}
function atualizarNav() {
  const q = passos[passo], b = document.getElementById('btn-prox'); if (!b || q.t !== 'item') return;
  const it = termo.itens[q.i]; b.disabled = !respondido(it);
  const e = document.getElementById('erro-passo'); if (e) e.textContent = !it.status ? '' : (it.status === 'ressalva' && !respondido(it) ? 'Escreva uma observação ou tire uma foto para continuar.' : '');
}
function avancar() { if (passo < passos.length - 1) { passo++; desenhar(); } }
function voltar() { if (passo > 0) { passo--; desenhar(); } }
function telaEnviado() {
  document.body.classList.add('wiz');
  document.getElementById('app').innerHTML = `<div class="ok-final"><div class="circ">✓</div><h2 class="q-txt" style="margin:0 0 10px">Termo enviado!</h2>
    <p style="color:var(--text2);margin:0 0 28px">Obrigado. A Absoluta já recebeu as suas respostas e a sua assinatura.</p>
    <button class="btn primary big" id="btn-pdf" onclick="baixarPdf()">Baixar uma cópia em PDF</button>
    <button class="btn big" style="margin-top:10px" onclick="window._enviado=false;document.body.classList.remove('wiz');render();window.scrollTo(0,0)">Ver o termo</button></div>`;
}

carregar();
</script>
